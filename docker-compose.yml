services:
  stock-monitor:
    build:
      context: /opt/tcg-monitor
      dockerfile: Dockerfile
    container_name: pokemon-stock-monitor
    env_file: /opt/tcg-monitor/.env
    environment:
      DB_PATH: /data/state.db
      HEARTBEAT_PATH: /data/heartbeat
      TARGETS_FILE: /app/targets.yaml
    volumes:
      - /opt/tcg-monitor/data:/data
      - /opt/tcg-monitor/targets.yaml:/app/targets.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/data/heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 300 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
